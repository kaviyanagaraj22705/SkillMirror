[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmirror"
version = "1.0.0"
description = "Analyze resumes against job descriptions, find skill gaps, and generate learning roadmaps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "PyMuPDF>=1.24",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "python-docx>=1.1",
  "filetype>=1.2",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency injection *is* a call in a default argument.
ignore = ["E501", "B008"]

[tool.coverage.run]
omit = ["app/llm/prompts.py", "app/llm/json_schemas.py"]
